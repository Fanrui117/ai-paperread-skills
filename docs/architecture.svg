<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrowWrite" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/>
    </marker>
  </defs>

  <rect width="960" height="520" fill="#f8fafc"/>

  <!-- Zotero -->
  <rect x="40" y="60" width="200" height="120" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="140" y="92" text-anchor="middle" font-size="17" font-weight="700" fill="#3730a3">Zotero</text>
  <text x="140" y="116" text-anchor="middle" font-size="12" fill="#4338ca">论文库（sqlite + PDF）</text>
  <text x="140" y="138" text-anchor="middle" font-size="12" fill="#4338ca">本地 API :23119</text>
  <text x="140" y="160" text-anchor="middle" font-size="11" fill="#6d28d9">只读扫描（默认）</text>

  <!-- Connector -->
  <rect x="40" y="230" width="200" height="90" rx="10" fill="#fff7ed" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="140" y="258" text-anchor="middle" font-size="15" font-weight="700" fill="#b45309">Zotero Connector</text>
  <text x="140" y="280" text-anchor="middle" font-size="11" fill="#92400e">/connector/saveItems</text>
  <text x="140" y="298" text-anchor="middle" font-size="11" fill="#92400e">可选：写入新论文</text>

  <!-- CLI -->
  <rect x="330" y="120" width="230" height="200" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="445" y="150" text-anchor="middle" font-size="17" font-weight="700" fill="#065f46">paperread CLI</text>
  <text x="445" y="176" text-anchor="middle" font-size="11" fill="#047857">scan / find / add / ingest</text>
  <text x="445" y="196" text-anchor="middle" font-size="11" fill="#047857">plan / extract / translate</text>
  <text x="445" y="216" text-anchor="middle" font-size="11" fill="#047857">formulas / tables / mathfix</text>
  <text x="445" y="236" text-anchor="middle" font-size="11" fill="#047857">packet / verify / index</text>
  <text x="445" y="262" text-anchor="middle" font-size="11" fill="#065f46">blocks.json + 翻译缓存</text>
  <text x="445" y="282" text-anchor="middle" font-size="11" fill="#065f46">锚点 ^pN / 相对链接</text>

  <!-- Agent -->
  <rect x="640" y="60" width="270" height="150" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="775" y="90" text-anchor="middle" font-size="17" font-weight="700" fill="#5b21b6">DSH Agent</text>
  <text x="775" y="114" text-anchor="middle" font-size="11" fill="#6d28d9">翻译 / 写精读笔记 / 看页图核对公式</text>
  <text x="775" y="136" text-anchor="middle" font-size="11" fill="#6d28d9">emit-tasks → 处理 JSON → import-json</text>
  <text x="775" y="158" text-anchor="middle" font-size="11" fill="#6d28d9">fixsrc / formulas / tables 修复</text>
  <text x="775" y="184" text-anchor="middle" font-size="11" fill="#5b21b6">skill: .agents/skills/paper-read</text>

  <!-- Obsidian -->
  <rect x="640" y="260" width="270" height="150" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="775" y="290" text-anchor="middle" font-size="17" font-weight="700" fill="#991b1b">Obsidian Vault</text>
  <text x="775" y="314" text-anchor="middle" font-size="11" fill="#b91c1c">note.md / summary.md</text>
  <text x="775" y="334" text-anchor="middle" font-size="11" fill="#b91c1c">full.md（中英对照 + 锚点）</text>
  <text x="775" y="354" text-anchor="middle" font-size="11" fill="#b91c1c">src.md / assets/</text>
  <text x="775" y="378" text-anchor="middle" font-size="11" fill="#991b1b">_索引.md · 相对链接 · $...$</text>

  <!-- arrows: Zotero -> CLI -->
  <line x1="240" y1="120" x2="328" y2="170" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="250" y="128" font-size="11" fill="#475569">只读扫描</text>

  <!-- arrows: CLI -> Obsidian -->
  <line x1="560" y1="220" x2="638" y2="300" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="566" y="250" font-size="11" fill="#475569">生成 / 校验</text>

  <!-- arrows: CLI <-> Agent -->
  <line x1="560" y1="170" x2="638" y2="140" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="570" y="146" font-size="11" fill="#475569">导出任务</text>
  <line x1="638" y1="170" x2="560" y2="196" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="566" y="196" font-size="11" fill="#475569">导入结果</text>

  <!-- arrows: agent -> connector (write) -->
  <line x1="640" y1="200" x2="245" y2="255" stroke="#b45309" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowWrite)"/>
  <text x="360" y="238" font-size="11" fill="#b45309">ingest（可选写库）</text>

  <!-- arrows: connector -> Zotero -->
  <line x1="140" y1="230" x2="140" y2="182" stroke="#b45309" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowWrite)"/>
  <text x="148" y="212" font-size="11" fill="#b45309">saveItems / updateSession</text>

  <!-- legend -->
  <rect x="40" y="400" width="870" height="86" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="60" y="424" font-size="12" fill="#334155">流程：</text>
  <text x="60" y="446" font-size="11" fill="#475569">① 全库：scan → plan --apply（一次建全库目录）   ② 单篇：find / add（只处理一篇，不扫全库）</text>
  <text x="60" y="466" font-size="11" fill="#475569">③ 处理：extract → translate（agent/baidu）→ packet → 写笔记 → verify   ④ 入库（可选）：ingest → Zotero Connector → Zotero</text>
</svg>
