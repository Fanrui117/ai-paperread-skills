[project]
name = "paperread"
version = "0.1.0"
description = "Zotero -> Obsidian paper reading pipeline: scan, plan, extract, translate, note, verify"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "PaperRead contributors" }]
keywords = ["zotero", "obsidian", "paper-reading", "translation", "llm"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
  "pymupdf>=2.1",
  "pymupdf4llm>=2.1",
  "httpx>=0.28",
  "python-frontmatter>=1.3",
  "pillow>=11",
]

[project.scripts]
paperread = "paperread.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paperread"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
